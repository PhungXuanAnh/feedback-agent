<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="1062" viewBox="0 0 1260 1062" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1F2933">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C8453B"/>
    </marker>
    <style>
      .title { font-size: 14px; font-weight: 700; }
      .body { font-size: 12px; }
      .small { font-size: 11px; }
      .note { font-size: 11px; font-style: italic; fill: #4B5563; }
      .file { font-family: 'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace; font-size: 10.5px; font-weight: 400; fill: #6B7280; }
      .mono { font-family: 'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace; font-size: 10.5px; }
      .code { fill: #E8F0FB; stroke: #4A78C2; stroke-width: 1.5; }
      .llm { fill: #E6F4EA; stroke: #3C8D50; stroke-width: 1.5; }
      .human { fill: #F1E8F8; stroke: #8A55B8; stroke-width: 1.5; }
      .fail { fill: #FDECEC; stroke: #C8453B; stroke-width: 1.2; stroke-dasharray: 5 3; }
      .degraded { fill: #FFF1E0; stroke: #D9822B; stroke-width: 1.5; }
      .neutral { fill: #F3F4F6; stroke: #8A8F98; stroke-width: 1.2; }
      .data { fill: #FFF6E0; stroke: #C29A3A; stroke-width: 1.5; }
      .flow { stroke: #4B5563; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .back { stroke: #4B5563; stroke-width: 1.4; fill: none; stroke-dasharray: 6 3; marker-end: url(#arrow); }
      .rail { stroke: #4B5563; stroke-width: 1.4; fill: none; stroke-dasharray: 6 3; }
      .failflow { stroke: #C8453B; stroke-width: 1.3; fill: none; stroke-dasharray: 5 3; marker-end: url(#arrow-red); }
      .pill-text { font-size: 11px; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1260" height="1062" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="20" y="30" font-size="20" font-weight="700">Agentic Customer Feedback System: architecture</text>
  <text x="20" y="52" class="body" fill="#4B5563">Fixed 6-step pipeline + one bounded tool-calling agent · LLM where language matters, code where it must be exact · paths under feedback_agent/</text>

  <!-- Entry points (outside the pipeline) -->
  <rect x="50" y="66" width="760" height="50" rx="8" class="code"/>
  <text x="66" y="87" class="title">API / CLI entry points</text>
  <text x="798" y="87" class="file" text-anchor="end">interfaces/api.py · interfaces/cli.py</text>
  <text x="66" y="105" class="body">POST /feedback or the run command · Pydantic validates text + email + channel + received_at, caps length</text>
  <line x1="810" y1="91" x2="848" y2="91" class="failflow"/>
  <rect x="850" y="71" width="370" height="40" rx="8" class="fail"/>
  <text x="864" y="96" class="body">invalid input → HTTP 422 (the pipeline never runs)</text>
  <line x1="430" y1="116" x2="430" y2="174" class="flow"/>
  <text x="438" y="130" class="small" fill="#374151">pipeline.process(feedback)</text>

  <!-- Pipeline frame (the orchestrator) -->
  <rect x="20" y="136" width="1220" height="736" rx="10" fill="none" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="450" y="160" class="title" fill="#374151">Pipeline (orchestrator) · one call per feedback · owns state, caps, trace_id <tspan class="file" dx="6">agent_core/pipeline.py</tspan></text>

  <!-- 1 Intake -->
  <rect x="50" y="176" width="760" height="50" rx="8" class="code"/>
  <text x="66" y="197" class="title">1 · Intake (code)</text>
  <text x="66" y="215" class="body">assigns feedback_id · starts the trace: trace_id, provider, caps, prompt versions</text>
  <line x1="430" y1="226" x2="430" y2="246" class="flow"/>

  <!-- 2 Injection guard -->
  <rect x="50" y="246" width="760" height="50" rx="8" class="code"/>
  <text x="66" y="267" class="title">2 · Injection guard (code)</text>
  <text x="798" y="267" class="file" text-anchor="end">agent_core/guard.py</text>
  <text x="66" y="285" class="body">regex flags injection_suspected (never blocks) · text wrapped in escaped &lt;customer_feedback&gt; tags</text>
  <line x1="430" y1="296" x2="430" y2="316" class="flow"/>

  <!-- 3 Classify -->
  <rect x="50" y="316" width="760" height="65" rx="8" class="llm"/>
  <text x="66" y="337" class="title">3 · Classify (1 schema-forced LLM call + code)</text>
  <text x="798" y="337" class="file" text-anchor="end">agent_core/classify.py</text>
  <text x="66" y="355" class="body">LLM: category + up to 2 alternatives · sentiment · urgency · confidence</text>
  <text x="66" y="372" class="body">code: urgency floor rules · low confidence or "unclear" → needs_human_triage</text>

  <!-- 4-5 Agent loop container -->
  <rect x="40" y="406" width="780" height="360" rx="10" fill="#F7FBF8" stroke="#3C8D50" stroke-width="1.5"/>
  <line x1="430" y1="381" x2="430" y2="459" class="flow"/>
  <text x="56" y="428" class="title">4–5 · Agent loop <tspan class="file" dx="6">agent_core/agent.py</tspan></text>
  <text x="56" y="446" class="body">LLM picks tools + queries; code enforces rules</text>
  <text x="560" y="428" class="small" fill="#374151">read-only tools: the agent only proposes,</text>
  <text x="560" y="444" class="small" fill="#374151">it cannot refund, close a ticket or email</text>

  <!-- LLM turn -->
  <rect x="320" y="461" width="220" height="46" rx="8" class="llm"/>
  <text x="430" y="481" class="title" text-anchor="middle">LLM turn n ≤ 4</text>
  <text x="430" y="498" class="small" text-anchor="middle">Gemini via adapter (scripted in tests)</text>

  <!-- branches out of the LLM turn -->
  <line x1="360" y1="507" x2="240" y2="544" class="flow"/>
  <text x="282" y="518" class="small" text-anchor="end" font-weight="700">submit_report</text>
  <line x1="500" y1="507" x2="620" y2="544" class="flow"/>
  <text x="572" y="518" class="small" font-weight="700">retrieval calls (parallel)</text>

  <!-- Evidence gate -->
  <rect x="60" y="544" width="360" height="52" rx="8" class="code"/>
  <text x="76" y="564" class="title">Evidence gate</text>
  <text x="408" y="564" class="file" text-anchor="end">agent_core/evidence.py</text>
  <text x="76" y="583" class="body">all 3 sources consulted? not_found counts, error does not</text>
  <line x1="240" y1="596" x2="240" y2="616" class="flow"/>

  <!-- Grounding validator -->
  <rect x="60" y="616" width="360" height="80" rx="8" class="code"/>
  <text x="76" y="636" class="title">Grounding validator</text>
  <text x="408" y="636" class="file" text-anchor="end">agent_core/validator.py</text>
  <text x="76" y="654" class="body">cited ids ∈ this run's tool results · each action's basis</text>
  <text x="76" y="671" class="body">allows it · issue_refund: invoice, ≤ cap, window, tier</text>
  <text x="76" y="688" class="note">shared: also checks the template report and officer overrides</text>

  <!-- shared return rail: missing source / invalid draft -->
  <path d="M60,570 H48" class="rail"/>
  <path d="M60,656 H48 V484 H318" class="back"/>
  <text x="56" y="476" class="small" fill="#374151">error message back (1 repair)</text>

  <!-- degraded template -->
  <line x1="185" y1="696" x2="185" y2="712" class="flow"/>
  <rect x="60" y="712" width="250" height="44" rx="8" class="degraded"/>
  <text x="74" y="730" class="body" font-weight="700">still invalid → code rebuilds</text>
  <text x="74" y="747" class="small">degraded_template · grounding_failed</text>
  <line x1="185" y1="756" x2="185" y2="788" class="flow"/>

  <!-- valid path -->
  <line x1="390" y1="696" x2="390" y2="788" class="flow"/>
  <text x="396" y="742" class="small" font-weight="700">valid</text>

  <!-- Tool executor -->
  <rect x="440" y="544" width="360" height="80" rx="8" class="code"/>
  <text x="456" y="564" class="title">Tool executor</text>
  <text x="788" y="564" class="file" text-anchor="end">agent_core/tool_executor.py</text>
  <text x="456" y="582" class="body">validates args · customer scope locked to metadata</text>
  <text x="456" y="599" class="body">cache · budget ≤ 6 calls · 1 retry</text>
  <text x="456" y="616" class="note">shared: also runs the degraded path's lookups</text>
  <line x1="498" y1="624" x2="498" y2="638" class="flow"/>
  <line x1="620" y1="624" x2="620" y2="638" class="flow"/>
  <line x1="742" y1="624" x2="742" y2="638" class="flow"/>

  <!-- tools -->
  <rect x="440" y="638" width="116" height="34" rx="6" class="neutral"/>
  <text x="498" y="659" class="mono" text-anchor="middle">get_cs_guidelines</text>
  <rect x="562" y="638" width="116" height="34" rx="6" class="neutral"/>
  <text x="620" y="659" class="mono" text-anchor="middle">lookup_customer</text>
  <rect x="684" y="638" width="116" height="34" rx="6" class="neutral"/>
  <text x="742" y="659" class="mono" text-anchor="middle">search_policies</text>
  <text x="800" y="685" class="file" text-anchor="end">agent_core/tools.py</text>

  <!-- results back to the LLM -->
  <path d="M800,566 H810 V484 H542" class="back"/>
  <text x="556" y="476" class="small" fill="#374151">results: found | not_found | error</text>

  <!-- cap note -->
  <rect x="440" y="692" width="360" height="64" rx="8" class="neutral"/>
  <text x="456" y="711" class="body" font-weight="700">Last turn reserved for submit_report (tool_choice)</text>
  <text x="456" y="728" class="body">missing sources → forced_by_system lookups (≤ 3)</text>
  <text x="456" y="745" class="body">flag step_limit_reached · confidence low</text>

  <!-- Report, saved -->
  <rect x="50" y="788" width="760" height="64" rx="8" class="code"/>
  <text x="66" y="809" class="title">Report, saved as pending_review</text>
  <text x="798" y="809" class="file" text-anchor="end">agent_core/report.py · database.py</text>
  <text x="66" y="827" class="body">code fills category / urgency / alternatives from classify · flags the LLM cannot remove · confidence = formula</text>
  <text x="66" y="844" class="body">process() returns here: the API answers 201 with report_id and trace_id</text>

  <!-- later: human review, outside the pipeline -->
  <line x1="430" y1="852" x2="430" y2="902" class="back"/>
  <text x="440" y="891" class="small" fill="#374151">later, a separate request: GET /reports?status=pending_review · POST /reports/{id}/review (API or CLI)</text>

  <!-- 6 Human review -->
  <rect x="50" y="904" width="760" height="96" rx="8" class="human"/>
  <text x="66" y="926" class="title">6 · Human review <tspan class="file" dx="6">agent_core/hitl.py</tspan></text>
  <text x="66" y="946" class="body">an officer approves, overrides or rejects</text>
  <text x="66" y="964" class="body">audit in SQLite: who, when, before / after</text>
  <text x="66" y="982" class="body">same decision again = idempotent · conflicting = 409</text>

  <rect x="400" y="939" width="120" height="26" rx="13" fill="#FFFFFF" stroke="#8A55B8"/>
  <text x="460" y="956" class="pill-text">pending_review</text>
  <rect x="560" y="914" width="100" height="22" rx="11" fill="#FFFFFF" stroke="#3C8D50"/>
  <text x="610" y="929" class="pill-text">approved</text>
  <rect x="560" y="941" width="100" height="22" rx="11" fill="#FFFFFF" stroke="#3C8D50"/>
  <text x="610" y="956" class="pill-text">overridden</text>
  <rect x="560" y="968" width="100" height="22" rx="11" fill="#FFFFFF" stroke="#C8453B"/>
  <text x="610" y="983" class="pill-text">rejected (final)</text>
  <rect x="700" y="927" width="100" height="22" rx="11" fill="#FFFFFF" stroke="#4A78C2"/>
  <text x="750" y="942" class="pill-text">executed (stub)</text>
  <line x1="520" y1="950" x2="558" y2="925" class="flow"/>
  <line x1="520" y1="952" x2="558" y2="952" class="flow"/>
  <line x1="520" y1="954" x2="558" y2="979" class="flow"/>
  <line x1="660" y1="925" x2="698" y2="936" class="flow"/>
  <line x1="660" y1="952" x2="698" y2="942" class="flow"/>

  <!-- Trace lane: one trace_id from intake to review -->
  <rect x="20" y="1016" width="1220" height="30" rx="6" class="neutral"/>
  <text x="36" y="1036" class="body"><tspan font-weight="700">Trace (JSONL, one trace_id from intake to review):</tspan> every event · tool args + results · latency · tokens · cost · prompt_version · used by eval and audit <tspan class="file" dx="6">ops/trace.py</tspan></text>

  <!-- Right column: failure paths and data -->
  <line x1="810" y1="271" x2="848" y2="271" class="failflow"/>
  <rect x="850" y="251" width="370" height="40" rx="8" class="fail"/>
  <text x="864" y="276" class="body">suspicious text is still processed; confidence lowered</text>

  <line x1="810" y1="348" x2="848" y2="348" class="failflow"/>
  <rect x="850" y="328" width="370" height="40" rx="8" class="fail"/>
  <text x="864" y="353" class="body">LLM fails → retry once → keyword rules</text>

  <line x1="820" y1="498" x2="848" y2="498" class="failflow"/>
  <rect x="850" y="461" width="370" height="80" rx="8" class="fail"/>
  <text x="864" y="480" class="body" font-weight="700">LLM error / timeout → retry once →</text>
  <text x="864" y="497" class="body">degraded path (no LLM): keep successful results,</text>
  <text x="864" y="514" class="body">call only the missing tools in a fixed order,</text>
  <text x="864" y="531" class="body">template report, flag degraded</text>
  <text x="1208" y="531" class="file" text-anchor="end">agent_core/pipeline.py</text>

  <line x1="800" y1="655" x2="848" y2="655" class="flow"/>
  <rect x="850" y="556" width="370" height="110" rx="8" class="data"/>
  <text x="864" y="576" class="title">Mock data (read-only)</text>
  <text x="1208" y="576" class="file" text-anchor="end">database.py · data/</text>
  <text x="864" y="596" class="body">SQLite: customers · tickets · invoices</text>
  <text x="864" y="614" class="body">JSON: guidelines · policies (with allowed_actions)</text>
  <text x="864" y="632" class="body">policies filtered by as_of = received_at</text>
  <text x="864" y="650" class="body">(effective / expires / supersedes)</text>

  <line x1="820" y1="714" x2="848" y2="714" class="failflow"/>
  <rect x="850" y="682" width="370" height="64" rx="8" class="fail"/>
  <text x="864" y="701" class="body" font-weight="700">source still failing (status error) →</text>
  <text x="864" y="718" class="body">incomplete_context, only escalate_to_human</text>
  <text x="864" y="735" class="body">(basis GL-TRIAGE, loaded as system evidence)</text>

  <line x1="810" y1="820" x2="848" y2="820" class="failflow"/>
  <rect x="850" y="800" width="370" height="40" rx="8" class="fail"/>
  <text x="864" y="825" class="body">storage error → API returns an error, never "queued"</text>

  <!-- Legend -->
  <rect x="850" y="934" width="14" height="12" rx="2" class="llm"/>
  <text x="870" y="945" class="small">LLM step</text>
  <rect x="932" y="934" width="14" height="12" rx="2" class="code"/>
  <text x="952" y="945" class="small">code</text>
  <rect x="994" y="934" width="14" height="12" rx="2" class="human"/>
  <text x="1014" y="945" class="small">human</text>
  <line x1="1062" y1="940" x2="1092" y2="940" class="failflow"/>
  <text x="1098" y="945" class="small">failure path</text>
  <line x1="1062" y1="962" x2="1092" y2="962" class="back"/>
  <text x="1098" y="967" class="small">loop back / later</text>
</svg>
